[project]
name = "androbugger"
version = "0.1.0"
description = "LLM-powered diagnostic platform for Android Interactive Flat Panels"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "adbutils>=2.12",
    "litellm>=1.60",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "chromadb>=1.0",
    "tantivy>=0.22",
    "sentence-transformers>=3.4",
    "aiosqlite>=0.20",
    "arq>=0.26",
    "redis>=5.0",
    "watchdog>=5.0",
    "argon2-cffi>=23.1",
    "weasyprint>=62.0",
    "markdown>=3.7",
    "pymupdf>=1.24",
    "mcp>=1.0",
    "typer>=0.12",
    "Pillow>=11.0",
    "croniter>=2.0",
    "rouge-score>=0.1",
    "aiosmtplib>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.scripts]
androbugger = "androbugger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/androbugger"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
